production:
  # The rolling Postgres to Airtable copy.
  airtable_sync:
    class: Airtable::SyncJob
    schedule: every minute

  # Hours coded per hour for the admin heatmap, and every pet's total.
  coding_hours:
    class: CodingHoursJob
    schedule: every hour

  # How many on Stardance's playground mission were active each day, by
  # their Hackatime time, for the daily active users chart.
  stardance_activity:
    class: StardanceActivityJob
    schedule: every hour at minute 30

  # Marks who is due the "no time yet" email, after the coding hours refresh.
  no_time_nudge:
    class: NoTimeNudgeJob
    schedule: every hour at minute 40

  # Adds participants with a linked Slack account to #playground, once each.
  slack_invite:
    class: SlackInviteJob
    schedule: every hour at minute 20

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
