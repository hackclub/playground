production:
  # The rolling Postgres to Airtable copy.
  airtable_sync:
    class: Airtable::SyncJob
    schedule: every minute

  # Hours coded per hour for the admin heatmap, and every pet's total.
  coding_hours:
    class: CodingHoursJob
    schedule: every hour

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
