# The Slack DM a participant gets when a reviewer decides about a ship
# (app/services/review_dm.rb). Edit the copy here.
#
# Slack mrkdwn, not HTML or Markdown: *bold*, _italic_, <https://link|link
# text>, and "> " at the start of a line for a quote. A single newline is a
# line break. https://docs.slack.dev/messaging/formatting-message-text/
#
# The site fills these in:
#   %{name}         the participant's display name
#   %{pet}          the pet's name
#   %{url}          the pet's page on the site
#   %{feedback}     the feedback block below, or nothing when the reviewer wrote none
#   %{reviewed_by}  the reviewed_by block below. The whole line goes when no
#                   reviewer is on record, and a fraud ban rejection has no
#                   reviewed_by line.
#   %{quote}        (feedback block) each line of the reviewer's feedback after "> "
#   %{reviewer}     (reviewed_by block) a Slack mention of the reviewer, or
#                   their name when they have no Slack id
en:
  review_dm:
    approved: |-
      Hey %{name}!

      Your pet <%{url}|%{pet}> has been approved!

      %{feedback}
      %{reviewed_by}

    changes_needed: |-
      Hey %{name}!

      Your pet <%{url}|%{pet}> has some feedback

      %{feedback}
      %{reviewed_by}

    rejected: |-
      Hey %{name}!

      Your pet <%{url}|%{pet}> has been rejected

      %{feedback}
      %{reviewed_by}

    # The reviewer's feedback. %{quote} is each line of it after "> ".
    feedback: |-
      Feedback:
      %{quote}

    # Who reviewed the ship, after the feedback. %{reviewer} is a Slack mention
    # of them, or their name when they have no Slack id.
    reviewed_by: |-
      - %{reviewer}
